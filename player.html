(function () {
  var playerId = new URLSearchParams(location.search).get('id');
  var revealAt = (typeof PLAYER_REVEAL_DATES !== 'undefined' && playerId) ? PLAYER_REVEAL_DATES[playerId] : null;
  if (revealAt && new Date() < new Date(revealAt)) {
    var d = new Date(revealAt);
    var dateStr = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var timeStr = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    document.write(
      '<style>body > *:not(.reveal-lock-screen){display:none !important;}</style>' +
      '<div class="reveal-lock-screen"><div class="reveal-lock-inner">' +
        '<div class="reveal-lock-eyebrow">The Handley Cup</div>' +
        '<h1 class="reveal-lock-title">Not Revealed Yet</h1>' +
        '<p class="reveal-lock-sub">This player hasn\u2019t been revealed yet \u2014 check back ' + dateStr + ' at ' + timeStr + '.</p>' +
        '<a class="reveal-lock-link" href="index.html">\u2190 Back to the homepage</a>' +
      '</div></div>'
    );
  }
})();
</script>

  <div id="page-content"></div>

  <script src="players-data.js"></script>
  <script src="common.js"></script>
  <script src="records-data.js"></script>
  <script src="power-rankings-data.js"></script>
  <script src="events-data.js"></script>
  <script>

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const player = PLAYERS.find(p => p.id === id);
    const content = document.getElementById('page-content');

    function ringSvg() {
      return `<svg class="hero-rings" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="210" cy="210" r="200" fill="none" stroke="#FBF4F6" stroke-width="1" opacity="0.12"/>
        <circle cx="210" cy="210" r="150" fill="none" stroke="#E31C79" stroke-width="1" opacity="0.22"/>
        <circle cx="210" cy="210" r="100" fill="none" stroke="#FBF4F6" stroke-width="1" opacity="0.12"/>
        <circle cx="210" cy="210" r="50" fill="none" stroke="#AC145A" stroke-width="1.5" opacity="0.35"/>
        <circle cx="210" cy="210" r="6" fill="#AC145A" opacity="0.4"/>
      </svg>`;
    }

    const igLinkHtml = `<a href="about.html">About &amp; Privacy</a><a class="ig-link" href="https://www.instagram.com/hallamdarts/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        @hallamdarts
      </a>`;

    function setMeta(title, desc) {
      document.title = title;
      const descTag = document.querySelector('meta[name="description"]');
      if (descTag) descTag.setAttribute('content', desc);
      document.querySelectorAll('meta[property="og:title"]').forEach(t => t.setAttribute('content', title));
      document.querySelectorAll('meta[property="og:description"]').forEach(t => t.setAttribute('content', desc));
    }

    // ---- Career Arc: colour timeline by season + key stats underneath ----
    // One coloured block per season (matches the society's original spreadsheet key):
    // green = attended, red = did not attend, yellow = Handley Cup winner,
    // light blue = Cup runner-up, orange = Cup semi-finalist, purple = Plate winner.
    const ARC_STYLES = {
      cw:  { color: '#FFFF00', text: '#000', code: 'W',  label: 'Champion' },
      ru:  { color: '#9FC5E8', text: '#000', code: 'RU', label: 'Runner Up' },
      sf:  { color: '#FF9900', text: '#000', code: 'SF', label: 'Semi Finalist' },
      pw:  { color: '#9900FF', text: '#fff', code: 'PW', label: 'Plate Champion' },
      att: { color: '#6AA84F', text: '#fff', code: '✓',  label: 'Attended' },
      dna: { color: '#CC0000', text: '#fff', code: '–',  label: 'Did not Attend' },
    };
    function arcKind(competition, result) {
      const isCup = competition === 'Handley Cup';
      if (isCup && result === 'Winner') return 'cw';
      if (isCup && result === 'Runner-Up') return 'ru';
      if (isCup && result === 'Semi-Final') return 'sf';
      if (!isCup && result === 'Winner') return 'pw';
      return 'att';
    }
    // short round label shown inside each block (P = Parson's Plate)
    function arcCode(competition, result) {
      const isCup = competition === 'Handley Cup';
      const cup = { 'Winner': 'W', 'Runner-Up': 'RU', 'Semi-Final': 'SF', 'Quarter-Final': 'QF',
                    'Last 16': 'L16', 'Last 24': 'L24', 'Last 32': 'L32', 'Walkover': 'WO', 'Withdrew': 'WD' };
      const plate = { 'Winner': 'P W', 'Runner-Up': 'P RUP', 'Semi-Final': 'P SF', 'Quarter-Final': 'P QF',
                      'Last 16': 'P 16', 'Last 24': 'P 24', 'Last 32': 'P 32', 'Walkover': 'P WO', 'Withdrew': 'P WD' };
      return (isCup ? cup : plate)[result] || (isCup ? '' : 'P ') + String(result).slice(0, 3).toUpperCase();
    }
    const ARC_RANK = { dna: 0, att: 1, pw: 2, sf: 3, ru: 4, cw: 5 };

    function renderCareerArc(player) {
      const section = document.getElementById('careerArcSection');
      const box = document.getElementById('careerArcBox');
      const timeline = player.timeline || [];
      if (!timeline.length) return;
      section.style.display = '';

      // every season the Handley Cup has run, so absences show up as red blocks
      const seasons = Array.from(new Set(PLAYERS.flatMap(p => (p.timeline || []).map(t => t.year)))).sort();

      const cells = seasons.map(y => {
        let best = null;
        timeline.filter(t => t.year === y).forEach(t => {
          const k = arcKind(t.competition, t.result);
          if (!best || ARC_RANK[k] > ARC_RANK[best.kind]) best = { kind: k, competition: t.competition, result: t.result };
        });
        const kind = best ? best.kind : 'dna';
        const st = ARC_STYLES[kind];
        const tip = best ? `${y} — ${best.competition}, ${best.result}` : `${y} — did not attend`;
        const code = best ? arcCode(best.competition, best.result) : st.code;
        return `<div class="arc-cell-wrap">
          <div class="arc-year">${y}</div>
          <div class="arc-cell" style="background:${st.color}; color:${st.text};" title="${tip}"><span class="arc-code${code.length > 2 ? ' long' : ''}">${code}</span></div>
        </div>`;
      }).join('');

      const legend = ['att', 'dna', 'cw', 'ru', 'sf', 'pw'].map(k =>
        `<span class="arc-key-item"><span class="arc-key-swatch" style="background:${ARC_STYLES[k].color}"></span>${ARC_STYLES[k].label}</span>`
      ).join('');

      const stat = (label, value, unit) => {
        const has = value !== null && value !== undefined;
        return `<div class="arc-stat ${has ? 'has' : 'none'}">
          <div class="arc-stat-label">${label}</div>
          <div class="arc-stat-value">${has ? value : '–'}${has && unit ? `<span class="arc-stat-unit"> ${unit}</span>` : ''}</div>
          ${has ? '' : '<div class="arc-stat-note">Not tracked</div>'}
        </div>`;
      };
      const oneEighties = player.oneEighties ?? null;
      const highCheckout = player.highestCheckout ? player.highestCheckout.value : null;
      const quickLeg = player.quickestLeg ? player.quickestLeg.darts : null;

      box.innerHTML = `
        <div class="arc-card">
          <div class="arc-row">${cells}</div>
          <div class="arc-key">${legend}</div>
          <div class="arc-codes">L16 / L24 / L32 = last 16, 24 or 32 · QF · SF · RU = runner-up · W = winner · P = Parson's Plate (P 16, P QF, P SF, P RUP, P W)</div>
          <div class="arc-stats">
            ${stat("180's", oneEighties)}
            ${stat('High Checkout', highCheckout)}
            ${stat('Quickest Leg', quickLeg, 'darts')}
          </div>
        </div>`;
    }

    if (!player) {
      content.innerHTML = `
        <div class="not-found">
          <h1>Player Not Found</h1>
          <p>We couldn't find a profile for that player.</p>
          <a href="players.html">← Back to all players</a>
        </div>`;
    } else if (player.placeholder) {
      content.innerHTML = `
        <nav class="breadcrumb">
          <a href="players.html">All Players</a><span>/</span>${player.name}
        </nav>
        <header class="hero">
          ${ringSvg()}
          <div class="hero-inner">
            <div class="avatar" aria-hidden="true">${silhouette}</div>
            <div class="hero-text">
              <div class="eyebrow">Player Profile — Data Pending</div>
              <h1 class="player-name">${player.name}</h1>
              <p class="player-sub">This player appears here because another profile links to them. Their stats haven't been added yet.</p>
            </div>
          </div>
        </header>
        <section class="page-section">
          <p class="fact-card">Add ${player.name.split(' ')[0]}'s appearances, best run, interesting facts and timeline using the same template — just send it over and it'll be added here.</p>
        </section>
        <footer class="site-footer">
          <a href="index.html">← Home Page</a>
          ${igLinkHtml}
        </footer>`;
      setMeta(`${player.name} — The Handley Cup`, `${player.name}'s Handley Cup profile — stats coming soon.`);
    } else {
      function compTagHtml(competition) {
        const cls = competition === 'Handley Cup' ? 'comp-handley' : 'comp-parsons';
        return `<span class="comp-tag ${cls}">${competition === 'Handley Cup' ? 'Cup' : 'Plate'}</span>`;
      }

      const timelineRows = player.timeline.map(t => `
        <tr class="${t.result === 'Winner' ? 'win-row' : ''}">
          <td class="year">${t.year}</td>
          <td>${compTagHtml(t.competition)}</td>
          <td><span class="result-pill ${t.result === 'Winner' ? 'result-win' : 'result-other'}">${t.result}</span></td>
          <td class="opponent">${t.opponentName ? opponentHtml(t.opponentId, t.opponentName) : '—'}</td>
          <td class="score">${t.score ? t.score : '—'}</td>
        </tr>`).join('');

      const avgValueHtml = player.highestAverage
        ? (player.highestAverage.link
            ? `<a class="avg-link" href="${player.highestAverage.link}" target="_blank" rel="noopener" title="Open the DartConnect match recap">${player.highestAverage.value.toFixed(2)}<span class="avg-link-arrow"> ↗</span></a>`
            : player.highestAverage.value.toFixed(2))
        : '—';
      const avgLinkHtml = (player.highestAverage && player.highestAverage.link)
        ? `<a href="${player.highestAverage.link}" target="_blank" rel="noopener">match recap ↗</a>`
        : 'Not tracked before 24/25';

      const cupWins = player.timeline.filter(t => t.competition === 'Handley Cup' && t.result === 'Winner').length;
      const plateWins = player.timeline.filter(t => t.competition === "Parson's Plate" && t.result === 'Winner').length;
      const crownHtml = (cupWins > 0 || plateWins > 0) ? `<div class="avatar-crown" title="Champion">👑</div>` : '';
      const starsHtml = `${cupWins > 0 ? `<span class="title-star star-gold" title="${cupWins}x Handley Cup Champion">★ Handley Cup${cupWins > 1 ? ` x${cupWins}` : ''}</span>` : ''}${plateWins > 0 ? `<span class="title-star star-silver" title="${plateWins}x Parson's Plate Champion">★ Parson's Plate${plateWins > 1 ? ` x${plateWins}` : ''}</span>` : ''}`;

      content.innerHTML = `
        <nav class="breadcrumb">
          <a href="players.html">All Players</a><span>/</span>${player.name}
        </nav>

        <header class="hero hero-sticky">
          ${ringSvg()}
          <div class="hero-inner">
            <div class="avatar-frame">
              <div class="avatar" aria-hidden="true">${avatarHtml(player)}</div>
              ${crownHtml}
            </div>
            <div class="hero-text">
              <div class="eyebrow">Player Profile</div>
              <h1 class="player-name">${player.name} ${flagHtml(player.nationality)}</h1>
              ${player.nickname ? `<div class="player-nickname">"${player.nickname}"</div>` : ''}
              <p class="player-sub">Career record and event history</p>
              ${starsHtml ? `<div class="title-star-row">${starsHtml}</div>` : ''}
            </div>
          </div>

          <div class="stat-strip">
            <div class="stat-block">
              <div class="stat-label">Appearances</div>
              <div class="stat-value">${player.appearances}</div>
            </div>
            <div class="stat-block">
              <div class="stat-label">Best Run</div>
              <div class="stat-value accent">${player.bestRun.label}</div>
              <div class="stat-meta">${player.bestRun.detail}</div>
            </div>
            <div class="stat-block">
              <div class="stat-label">Highest Average</div>
              <div class="stat-value">${avgValueHtml}</div>
              <div class="stat-meta">${avgLinkHtml}</div>
            </div>
          </div>
        </header>

        <section class="page-section" id="atrSection" style="display:none;">
          <div class="section-heading collapsible" data-collapse-target="atrBox">All-Time Record<span class="collapse-arrow">▾</span></div>
          <div id="atrBox"></div>
        </section>

        <section class="page-section" id="careerArcSection" style="display:none;">
          <div class="section-heading collapsible" data-collapse-target="careerArcBox">Player Performance Timeline<span class="collapse-arrow">▾</span></div>
          <div id="careerArcBox"></div>
        </section>

        <section class="page-section">
          <div class="section-heading collapsible" data-collapse-target="factsBox">About the Player<span class="collapse-arrow">▾</span></div>
          <div id="factsBox"></div>
        </section>

        <section class="page-section">
          <div class="section-heading collapsible" data-collapse-target="timelineWrap">Season Results<span class="collapse-arrow">▾</span></div>
          <div class="timeline-wrap" id="timelineWrap">
            <table class="timeline">
              <caption>Season by season.</caption>
              <thead>
                <tr>
                  <th>Year</th>
                  <th>Comp</th>
                  <th>Result</th>
                  <th>Opponent</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody>${timelineRows}</tbody>
            </table>
          </div>
        </section>

        <footer class="site-footer">
          <a href="index.html">← Home Page</a>
          ${igLinkHtml}
        </footer>`;

      setMeta(
        `${player.name} — The Handley Cup`,
        `${player.name}'s Handley Cup career: ${player.appearances} appearance${player.appearances === 1 ? '' : 's'}, best run ${player.bestRun.label} — ${player.bestRun.detail}.`
      );
      renderAbout(player);
      renderCareerArc(player);
      renderAllTimeRecord(player);
    }

    function renderAllTimeRecord(player) {
      const section = document.getElementById('atrSection');
      const box = document.getElementById('atrBox');
      if (typeof POWER_RANKINGS === 'undefined' || typeof EVENTS === 'undefined') return;
      const pr = POWER_RANKINGS.find(r => r.id === player.id);

      // combined (group + knockout) record, same aggregation as All Time Player Stats
      let played = 0, wins = 0, legsFor = 0, legsAgainst = 0;
      function addResult(lf, la) {
        played++; legsFor += lf; legsAgainst += la;
        if (lf > la) wins++;
      }
      Object.values(EVENTS).forEach(e => {
        Object.values(e.groupFixtures || {}).forEach(matches => {
          (matches || []).forEach(m => {
            if (m.score1 === null || m.score1 === undefined || m.score2 === null || m.score2 === undefined) return;
            if (m.player1Id === player.id) addResult(m.score1, m.score2);
            else if (m.player2Id === player.id) addResult(m.score2, m.score1);
          });
        });
        [e.cupBracket, e.plateBracket].forEach(bracket => {
          Object.values(bracket || {}).forEach(matches => {
            (matches || []).forEach(m => {
              if (m.winnerLegs === null || m.winnerLegs === undefined || m.loserLegs === null || m.loserLegs === undefined) return;
              if (m.winnerId === player.id) addResult(m.winnerLegs, m.loserLegs);
              else if (m.loserId === player.id) addResult(m.loserLegs, m.winnerLegs);
            });
          });
        });
      });

      if (!pr && !played) return; // nothing to show for a placeholder-ish profile

      section.style.display = '';
      const winPct = played ? ((wins / played) * 100).toFixed(1) : '0.0';
      const legDiff = legsFor - legsAgainst;

      box.innerHTML = `
        <div class="stat-strip atr-grid">
          <div class="stat-block">
            <div class="stat-label">Power Ranking</div>
            <div class="stat-value accent">${pr ? '#' + pr.rank : '—'}</div>
            <div class="stat-meta">${pr ? pr.score + ' pts' : ''}</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Played</div>
            <div class="stat-value">${played}</div>
            <div class="stat-meta">Group + Knockouts</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Wins</div>
            <div class="stat-value">${wins}</div>
            <div class="stat-meta">${winPct}% win rate</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Leg Difference</div>
            <div class="stat-value">${legDiff > 0 ? '+' : ''}${legDiff}</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Legs For</div>
            <div class="stat-value">${legsFor}</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Legs Against</div>
            <div class="stat-value">${legsAgainst}</div>
          </div>
        </div>
        <div style="text-align:center; margin-top:12px;">
          <a href="groups.html">See the full All Time Player Stats leaderboard →</a>
        </div>`;
    }

    // Renders the "About the Player" box: an optional narrative write-up
    // (player.writeup — add this field per player in players-data.js whenever
    // you've got a bio written) followed by the quick-hit facts, same shuffle
    // behaviour as before when there are more than 3.
    function renderAbout(player) {
      const box = document.getElementById('factsBox');
      if (!box) return;
      const recordFacts = (typeof RECORDS !== 'undefined' ? RECORDS : [])
        .filter(r => r.playerId === player.id)
        .map(r => r.text);
      // combine the player's own facts with any Records & Trivia entries that
      // mention them, own facts first, no duplicate strings
      const facts = [...(player.facts || [])];
      recordFacts.forEach(f => { if (!facts.includes(f)) facts.push(f); });
      const writeupHtml = player.writeup ? `<p class="player-writeup">${player.writeup}</p>` : '';

      if (!FACTS_READY) {
        box.innerHTML = writeupHtml || `<p class="fact-card pending">Facts and stats are being tidied up — check back soon.</p>`;
        return;
      }
      if (!facts.length) {
        box.innerHTML = writeupHtml || `<p class="fact-card pending">No write-up, facts or records added yet.</p>`;
        return;
      }
      function pick() {
        if (facts.length <= 3) return facts;
        const shuffled = [...facts].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 3);
      }
      function draw() {
        const chosen = pick();
        const shuffleBtn = facts.length > 3
          ? `<button class="shuffle-btn" id="shuffleFactsBtn" type="button">🎲 Show different facts</button>`
          : '';
        box.innerHTML = writeupHtml + chosen.map(f => `<p class="fact-card">${f}</p>`).join('') + shuffleBtn;
        const btn = document.getElementById('shuffleFactsBtn');
        if (btn) btn.addEventListener('click', draw);
      }
      draw();
    }
  </script>
